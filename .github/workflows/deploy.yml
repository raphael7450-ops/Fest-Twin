name: Fest-Twin CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-build:
    name: "CI - Test and Build"
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest test suite
        run: npm test

      - name: Build production bundle
        env:
          VITE_VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
        run: |
          test -n "$VITE_VWORLD_API_KEY" || { echo "VWORLD_API_KEY secret is required for the Vite build."; exit 1; }
          npm run build

  deploy:
    name: "CD - Remote Docker Deploy"
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Check deployment secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.REMOTE_HOST }}" ] && [ -n "${{ secrets.REMOTE_USER }}" ] && [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ] && [ -n "${{ secrets.VWORLD_API_KEY }}" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "[NOTICE] Remote deployment secrets (REMOTE_HOST, REMOTE_USER, SSH_PRIVATE_KEY, VWORLD_API_KEY) are not set. Skipping SSH deployment."
          fi

      - name: Deploy container on remote Docker server via SSH
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e
            echo "==> Pulling latest changes from main branch..."
            cd ~/fest-twin-demo || (git clone https://github.com/raphael7450-ops/Fest-Twin.git ~/fest-twin-demo && cd ~/fest-twin-demo)
            git fetch origin main
            git reset --hard origin/main

            echo "==> Building Docker image..."
            VWORLD_API_KEY="${{ secrets.VWORLD_API_KEY }}"
            docker build --build-arg VWORLD_API_KEY="$VWORLD_API_KEY" -t fest-twin-demo:latest .

            echo "==> Stopping old container..."
            EXISTING_CONTAINER=$(docker ps -aq -f name=^fest-twin-demo$)
            if [ -n "$EXISTING_CONTAINER" ]; then
              docker stop fest-twin-demo || true
              docker rm fest-twin-demo || true
            fi

            echo "==> Starting new container..."
            if [ -f "$HOME/fest-twin-demo.env" ]; then
              docker run -d --name fest-twin-demo --env-file "$HOME/fest-twin-demo.env" --restart unless-stopped -p 18080:80 fest-twin-demo:latest
            else
              docker run -d --name fest-twin-demo --restart unless-stopped -p 18080:80 fest-twin-demo:latest
            fi

            echo "==> Performing deployment health check..."
            sleep 3
            curl -f -s http://localhost:18080/api/scenarios > /dev/null || (echo "Health check failed!" && exit 1)
            echo "Deployment successful!"

